<dialog #dlg class="admin-modal" (close)="closed.emit()" (click)="onBackdrop($event)">
  <div class="admin-modal-box">
    <header>
      <h2>{{ title() }}</h2>
      <button class="icon-btn" type="button" aria-label="Close" (click)="close()">✕</button>
    </header>
    <div class="admin-modal-body"><ng-content /></div>
  </div>
</dialog>
